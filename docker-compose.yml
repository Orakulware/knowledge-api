services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER_ENV}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_ENV}
      POSTGRES_DB: ${POSTGRES_DB_NAME_ENV}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_ENV} -d ${POSTGRES_DB_NAME_ENV}"]
      interval: 3s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER_ENV}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD_ENV}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD_ENV}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD_ENV}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    env_file: .env
    environment:
      POSTGRES_HOST_ENV: postgres
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      POSTGRES_HOST_ENV: postgres
      RABBITMQ_HOST_ENV: rabbitmq
      REDIS_HOST_ENV: redis
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys
          with urllib.request.urlopen("http://localhost:8000/health/ready/") as r:
              sys.exit(0 if r.status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  rabbitmq_data:
