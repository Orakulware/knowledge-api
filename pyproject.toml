[project]
name = "knowledge-api"
version = "0.1.0"
description = "Core service for the Orakulware"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "authx>=1.6.0",
    "dependency-injector>=4.49.1",
    "fastapi[standard]>=0.136.3",
    "sqlalchemy>=2.0.50",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    # identitcal by code != identical by meaning
    "SIM114",

    # awful things, never use.
    # It makes runtime work differently from typechecker
    "TC001",
    "TC002",
    "TC003",

    # only affects perfomance and brings nothing useful
    "UP038",
]
# Sort in alphabet order
extend-select = ["I"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = ["src/knowledge_api"]
# dmypy fine-grained incremental crashes on Python 3.14 stdlib (concurrent.futures KeyError)
# disable incremental mode until upstream mypy fixes the daemon
incremental = false
